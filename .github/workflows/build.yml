name: Build & Release CLI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'GooseHost-CLI/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'GooseHost-CLI/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: GooseHost-CLI   # ← 关键：所有 run 步骤默认在 CLI 目录里执行

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, name: goosehost-windows-amd64.exe }
          - { goos: windows, goarch: arm64, name: goosehost-windows-arm64.exe }
          - { goos: linux,   goarch: amd64, name: goosehost-linux-amd64 }
          - { goos: linux,   goarch: arm64, name: goosehost-linux-arm64 }
          - { goos: darwin,  goarch: amd64, name: goosehost-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, name: goosehost-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: GooseHost-CLI/go.sum

      - name: Validate tag (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .              # 校验不用进子目录
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' 不符合语义化版本规范 (vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o ${{ matrix.name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: GooseHost-CLI/${{ matrix.name }}    # ← 注意这里要带子目录前缀
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true