<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>重置密码 - GooseHost</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-primary: #0a0f0d;
            --bg-card: rgba(20, 35, 25, 0.85);
            --accent: #02ff8e;
            --accent-dark: #00cc6a;
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --error: #ff6b6b;
            --error-bg: rgba(255, 82, 82, 0.12);
            --success: #02ff8e;
            --success-bg: rgba(2, 255, 142, 0.12);
            --border: rgba(2, 255, 142, 0.15);
            --border-focus: rgba(2, 255, 142, 0.35);
            --radius: 6px;
            --input-height: clamp(44px, 8vw, 52px);
        }
        @font-face {
            font-family: 'DingTalk JinBuTi';
            src: url('fonts/DingTalk JinBuTi.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'DingTalk JinBuTi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .page {
            position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; overflow-y: auto;
        }
        .card {
            width: 100%; max-width: 420px;
            background: var(--bg-card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 2rem; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo img { height: clamp(36px, 10vw, 52px); }
        .card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .tip { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1rem; }
        .msg {
            padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem;
            font-size: 0.9rem; text-align: center; display: none;
        }
        .msg.error { display: block; background: var(--error-bg); color: var(--error); border: 1px solid rgba(255, 82, 82, 0.2); }
        .msg.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid rgba(2, 255, 142, 0.2); }
        .form-group { margin-bottom: 1rem; }
        .input-wrap { position: relative; }
        .input-wrap.floating {
            border: 1px solid var(--border); background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius); transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-wrap.floating:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 255, 142, 0.12); }
        .input-wrap.floating i {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            color: rgba(2, 255, 142, 0.55); font-size: 1rem; pointer-events: none;
        }
        .input-wrap.floating input {
            width: 100%; height: var(--input-height);
            padding: 0 1rem 0 calc(1rem * 2 + 1.2rem);
            background: transparent; border: none; color: #fff; font-size: 1rem;
        }
        .input-wrap.floating input:focus { outline: none; }
        .input-wrap.floating label {
            position: absolute; left: calc(1rem * 2 + 1.2rem); top: 50%;
            transform: translateY(-50%); font-size: 1rem; color: var(--text-secondary);
            pointer-events: none; padding: 0 4px; transition: all 0.18s ease;
        }
        .input-wrap.floating input:focus ~ label,
        .input-wrap.floating input:not(:placeholder-shown) ~ label {
            top: 0; transform: translateY(-50%); font-size: 0.7rem; color: var(--accent); background: var(--bg-card);
        }
        .btn {
            width: 100%; height: var(--input-height); border: none; border-radius: var(--radius);
            font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 0.5rem; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #001a0d; margin-top: 0.25rem; }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 24px rgba(2, 255, 142, 0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.3); }
        .link-row { text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .link-row a:hover { text-decoration: underline; }
        #doneBox { text-align: center; }
        #doneBox i { font-size: 3rem; color: var(--success); }
        #doneBox p { margin: 1rem 0 1.5rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="logo">
                <img src="./logo.svg" alt="GooseHost" />
            </div>

            <div id="msg" class="msg"></div>

            <div id="formBox">
                <h3>设置新密码</h3>
                <p class="tip">请输入你的新密码，完成后即可用新密码登录。</p>

                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder=" " autocomplete="new-password" />
                        <label for="password">新密码</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm" placeholder=" " autocomplete="new-password" />
                        <label for="confirm">确认新密码</label>
                    </div>
                </div>

                <button id="submitBtn" class="btn btn-primary" onclick="submitReset()">
                    <i class="fas fa-check"></i> 重置密码
                </button>

                <div class="link-row">
                    <a href="login.html">返回登录</a>
                </div>
            </div>

            <div id="doneBox" style="display:none;">
                <i class="fas fa-check-circle"></i>
                <p>密码已重置，正在跳转到登录页...</p>
                <a href="login.html" class="btn btn-primary">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL_FALLBACK = 'https://page.goose.gs.cn';
        let API_URL = API_URL_FALLBACK;

        fetch(API_URL_FALLBACK + '/api/config')
            .then(r => r.json())
            .then(d => { if (d && d.apiUrl) API_URL = d.apiUrl; })
            .catch(() => {});

        function getToken() {
            const params = new URLSearchParams(location.hash.slice(1));
            return params.get('access_token');
        }
        function showMsg(msg, type) {
            const el = document.getElementById('msg');
            el.textContent = msg;
            el.className = 'msg ' + type;
        }

        window.addEventListener('load', () => {
            if (!getToken()) {
                showMsg('重置链接无效或已过期，请重新申请', 'error');
                document.getElementById('submitBtn').disabled = true;
            }
        });

        async function submitReset() {
            const token = getToken();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const btn = document.getElementById('submitBtn');

            if (!token) { showMsg('重置链接无效，请重新申请', 'error'); return; }
            if (password.length < 6) { showMsg('密码至少 6 位', 'error'); return; }
            if (password !== confirm) { showMsg('两次密码不一致', 'error'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';
            try {
                const res = await fetch(API_URL + '/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '重置失败');
                document.getElementById('formBox').style.display = 'none';
                document.getElementById('doneBox').style.display = 'block';
                setTimeout(() => location.href = 'login.html', 2200);
            } catch (err) {
                showMsg(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> 重置密码';
            }
        }
    </script>
    <script src="moved-banner.js"></script>
</body>
</html>
