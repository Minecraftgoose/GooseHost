<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>注册 - GooseHost</title>
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon-16x16.png" />
    <link rel="apple-touch-icon" href="../icons/icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512x512.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0f0d" />
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bgLayer" class="bg-layer"></div>

    <div class="page">
        <div class="card">
            <div class="logo">
                <img src="../logo.svg" alt="GooseHost" />
            </div>

            <div id="msg" class="msg"></div>

            <form onsubmit="register(event)">
                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nickname" placeholder=" " required maxlength="20" autocomplete="nickname" />
                        <label for="nickname">昵称</label>
                    </div>
                    <div class="hint">2-20 个字符，支持中英文、数字、下划线、空格和连字符</div>
                </div>
                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder=" " required autocomplete="email" />
                        <label for="email">邮箱</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder=" " required minlength="6" autocomplete="new-password" />
                        <label for="password">密码</label>
                    </div>
                    <div class="hint">密码至少 6 位字符</div>
                </div>
                <div class="form-group">
                    <div class="input-wrap floating">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder=" " required autocomplete="new-password" />
                        <label for="confirmPassword">确认密码</label>
                    </div>
                </div>
                <button type="submit" id="registerBtn" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> 注册
                </button>
            </form>

            <div class="link-row">
                已有账号？<a href="../login/">立即登录</a>
            </div>
            <div class="legal-notice">
                注册即代表你同意 <a href="https://host.goose.gs.cn/docs/?doc=terms" target="_blank">用户协议</a> 与 <a href="https://host.goose.gs.cn/docs/?doc=terms" target="_blank">隐私政策</a>
            </div>
            <div style="margin-top: 1rem; text-align: center;">
                <a href="../status" style="color: var(--text-secondary);">系统状态</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
<script src="../moved-banner.js"></script>
</body>
</html>
